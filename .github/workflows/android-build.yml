
name: Natro Mobile Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Natro Mobile APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Verify Android SDK installation
      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager was not found."
            echo "Expected: $SDKMANAGER"
            exit 1
          fi

          echo "Android SDK found."
          "$SDKMANAGER" --version

      # 4. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      # 5. Install only the required Android packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            --sdk_root="$ANDROID_HOME"

          echo "Checking installed SDK packages..."

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/platform-tools"

          echo "All required Android SDK packages are installed."

      # 6. Configure Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Extract uploaded Natro Mobile source ZIP
      - name: Extract Natro Mobile source
        shell: bash
        run: |
          set -e

          ARCHIVE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No source ZIP found in repository root."
            exit 1
          fi

          mkdir -p source
          unzip -q "$ARCHIVE" -d source

          PROJECT_FILE="$(find source -type f -name build.gradle ! -path '*/app/*' -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Root build.gradle was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          for ITEM in build.gradle app gradle.properties tests; do
            if [ ! -e "$PROJECT_DIR/$ITEM" ]; then
              echo "ERROR: Missing project component: $ITEM"
              exit 1
            fi
            cp -a "$PROJECT_DIR/$ITEM" .
          done

          echo "Natro Mobile source extracted successfully."

      # 8. Generate Gradle settings
      - name: Create Gradle settings
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NatroMobile"
          include(":app")
          EOF

      # 9. Verify project structure
      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f build.gradle
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f tests/run.sh

          echo "Project structure verified."

      # 10. Run existing tests
      - name: Run Natro Mobile tests
        shell: bash
        run: bash tests/run.sh

      # 11. Compile Android application
      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --no-daemon

      # 12. Verify APK output
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      # 13. Upload APK
      - name: Upload Natro Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: NatroMobile-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 14. Upload test reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NatroMobile-test-reports
          path: build/tests/
          if-no-files-found: ignore
