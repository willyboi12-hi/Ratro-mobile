
name: Natro Mobile Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Natro Mobile APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Java
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Locate Android SDK manager
      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK manager found."
          "$SDKMANAGER" --version

      # 4. Accept and verify SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          echo "Processing Android SDK licenses..."

          set +e
          yes | "$SDKMANAGER" --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "ERROR: SDK manager could not accept licenses."
            exit "$SDK_STATUS"
          fi

          echo "Checking accepted licenses..."

          "$SDKMANAGER" --licenses

          echo "Android SDK license verification passed."

      # 5. Install SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            --sdk_root="$ANDROID_HOME"

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK installation verified."

      # 6. Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Extract source ZIP
      - name: Extract Natro Mobile source
        shell: bash
        run: |
          set -e

          ARCHIVE="$(find . -maxdepth 1 -type f \
            -name '*.zip' -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: Source ZIP not found."
            exit 1
          fi

          mkdir -p source
          unzip -q "$ARCHIVE" -d source

          PROJECT_FILE="$(find source -type f \
            -name build.gradle ! -path '*/app/*' -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Root build.gradle not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          for ITEM in build.gradle app gradle.properties tests; do
            if [ ! -e "$PROJECT_DIR/$ITEM" ]; then
              echo "ERROR: Missing project component: $ITEM"
              exit 1
            fi

            cp -a "$PROJECT_DIR/$ITEM" .
          done

          echo "Source extraction successful."

      # 8. Create Gradle settings
      - name: Create Gradle settings
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NatroMobile"
          include(":app")
          EOF

      # 9. Verify project
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          test -f build.gradle
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f tests/run.sh

          echo "Project structure verified."

      # 10. Run tests
      - name: Run Natro Mobile tests
        shell: bash
        run: bash tests/run.sh

      # 11. Build APK
      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --no-daemon

      # 12. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 13. Upload APK
      - name: Upload Natro Mobile APK
        uses: actions/upload-artifact@v6
        with:
          name: NatroMobile-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 14. Upload test reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NatroMobile-test-reports
          path: build/tests/
          if-no-files-found: ignore
